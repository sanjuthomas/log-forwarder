name: Kafka smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kafka-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kafka-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Kafka smoke test
        run: |
          chmod +x scripts/kafka-smoke.sh scripts/kafka-deadletter-smoke.sh
          ./scripts/kafka-smoke.sh
          ./scripts/kafka-deadletter-smoke.sh
