name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "scripts/sync-wiki.sh"
      - ".github/workflows/sync-wiki.yml"

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync wiki to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-wiki.sh
