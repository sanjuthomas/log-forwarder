name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. Comment if you are still working on this
            or want it kept open.
          stale-pr-message: >
            This pull request has been inactive for 60 days. It will be closed in 14
            days unless there is new activity.
          close-issue-message: >
            Closed due to prolonged inactivity. Reopen or open a new issue if this
            is still relevant.
          close-pr-message: >
            Closed due to prolonged inactivity. Feel free to reopen or submit a fresh PR.
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          operations-per-run: 30
