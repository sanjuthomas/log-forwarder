name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve. For large features, expect discussion before implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What pain point does this address? Who benefits?
      placeholder: We need to forward logs to S3 when Kafka is unavailable...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Config keys, CLI flags, or API shape if you have ideas.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools you evaluated.

  - type: checkboxes
    id: scope
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this
          required: false
