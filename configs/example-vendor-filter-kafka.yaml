# Vendor appliance with DEBUG noise — filter to INFO/WARN/ERROR before Kafka ingest.
#
# Scenario: a third-party system (payment gateway, ERP, OSS box) logs heavily at DEBUG
# and you cannot change its log level. Tail locally, drop DEBUG at the edge, and ship
# only operational levels to your centralized store to cut per-GB ingestion cost.
#
# Wiki walkthrough: Filtering Vendor Noise
#   https://github.com/sanjuthomas/log-forwarder/wiki/Filtering-Vendor-Noise
#
# Sample vendor log line (tab-delimited):
#   2026-06-13 14:22:01.123	DEBUG	com.acme.AuthService	Validating token merchantId=44102
#   2026-06-13 14:22:01.124	INFO	com.acme.AuthService	Authorization approved amount=129.99
#
# Run:
#   ./bin/log-forwarder -config configs/example-vendor-filter-kafka.yaml

watch:
  poll: 1s
  paths:
    - /var/log/acme-gateway
  patterns:
    - "*.log"
  state:
    path: /var/lib/log-forwarder/acme-gateway-watermarks.json

parser:
  type: line

transform:
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - logger
    - message
  on_error: wrap

filter:
  match: any
  rules:
    - type: field
      field: level
      op: in
      values: [INFO, WARN, ERROR]
      ignore_case: true

enrichers:
  - type: static
    fields:
      application_id: acme-payment-gateway
      environment: prod
      vendor: acme-corp
      cost_center: payments
  - type: host

sink:
  type: kafka
  kafka:
    brokers:
      - kafka.internal:9092
    topic: logs.prod.payments

pipeline:
  buffer_size: 4096
  on_full: block

metrics:
  enabled: true
  host: 0.0.0.0
  port: 8080

logging:
  level: info
  format: text
