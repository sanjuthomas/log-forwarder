watch:
  poll: 1s
  sources:
    - path: ./logs/app
      patterns:
        - "*.log"

sink:
  type: file
  file:
    path: ./output/forwarded.jsonl

transform:
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - message
  on_error: wrap

enrichers:
  - type: host

pipeline:
  buffer_size: 1024
  on_full: block
