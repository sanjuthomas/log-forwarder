watch:
  poll: 1s
  state:
    path: .log-forwarder/watermarks.json
  sources:
    - path: ./logs/app
      patterns:
        - "*.log"
        - "*.log.*"
        - "*.out"
        - "*.jsonl"
    - path: ./logs/nginx
      patterns:
        - "*.log"
        - "*.log.*"
        - "*.jsonl"
    - path: /var/log/my-service
      patterns:
        - "*.log"
        - "*.log.*"
        - "*.out"
        - "*.jsonl"

sink:
  type: kafka
  kafka:
    brokers:
      - localhost:9092
    topic: logs

transform:
  # Delimiter-based parsing (default). Set type to "regex" for pattern-based parsing
  # (see configs/example-regex.yaml and configs/example-spring-boot-kafka.yaml).
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - message
  on_error: wrap

enrichers:
  - type: static
    fields:
      application_id: billing-service
      environment: dev
  - type: host

pipeline:
  buffer_size: 1024
  on_full: block

logging:
  level: info
  format: text
  file: /var/log/log-forwarder/forwarder.log
  status_interval: 30s

metrics:
  enabled: true
  host: 127.0.0.1
  port: 8080
  path: /metrics
