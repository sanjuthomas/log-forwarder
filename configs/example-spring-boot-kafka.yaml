# Spring Boot default console log format (Logback) — Kafka sink.
# See also: example-spring-boot-file.yaml, example-spring-boot-http-noauth.yaml
#
# Run:
#   ./bin/log-forwarder -config configs/example-spring-boot-kafka.yaml
#
#   <timestamp>  <level> <pid> --- [<thread>] <logger> : <message>
#
# Multiline stack traces (indented frames, Caused by:, etc.) are grouped into one
# record by the multiline parser before the regex transform runs.
# flush_interval publishes the trailing record after quiet time (default 100ms)
# so the last log line is not held until the next header or shutdown.
#
# Example error with stack trace becomes one JSON payload:
#   {
#     "timestamp": "2026-06-08 10:16:22.901",
#     "level": "ERROR",
#     "pid": "18432",
#     "thread": "nio-8080-exec-5",
#     "logger": "c.a.b.controller.PaymentController",
#     "message": "Payment failed for invoiceId=inv_98765\norg.springframework.dao.DataIntegrityViolationException: ...",
#     "_path": "/var/log/billing/application.log",
#     "application_id": "billing-service",
#     "environment": "dev",
#     "hostname": "app-server-01"
#   }

watch:
  poll: 1s
  sources:
    - path: ./logs/spring-boot
      patterns:
        - "*.log"
        - "*.log.*"
        - "*.out"

sink:
  type: kafka
  kafka:
    brokers:
      - localhost:9092
    topic: logs
  # Kafka delivery is at-least-once (leader ack, debounced watermarks). Consumers must dedupe.
  # See wiki: Choosing a Sink → Kafka delivery semantics.

parser:
  type: multiline
  start_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
  flush_interval: 100ms

transform:
  type: regex
  pattern: '^(?s)(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\S+)\s+(?P<pid>\d+)\s+---\s+\[\s*(?P<thread>[^\]]+?)\s*\]\s+(?P<logger>\S+)\s+:\s+(?P<message>.*)$'
  on_error: wrap

timestamp:
  field: timestamp
  format: "2006-01-02 15:04:05.000"
  default_timezone: UTC

enrichers:
  - type: static
    fields:
      application_id: billing-service
      environment: dev
  - type: host

pipeline:
  buffer_size: 1024
  on_full: block

metrics:
  enabled: true
  host: 0.0.0.0  # listen on all interfaces so /health is reachable by hostname (required for ATC)
  port: 10001
  path: /metrics

# log-forwarder-atc integration (optional):
#   Wiki: https://github.com/sanjuthomas/log-forwarder/wiki/Log-Forwarder-ATC
#   - After startup: PUT registers hostname, metrics.port, process_id, UTC timestamp.
#   - On shutdown (SIGINT/SIGTERM): DELETE deregisters the same instance.
#   - While running: no ATC traffic — the controller polls GET /health and GET /ready here.
#   - Registration failures log WARN and do not stop log forwarding.
#   - atc.enabled requires metrics.enabled (and host reachable by hostname when remote).
atc:
  enabled: true
  url: http://localhost:8090/api/instances
  # timeout: 5s  # optional; default 5s for PUT/DELETE
