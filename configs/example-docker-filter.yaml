# File-sink smoke test with ERROR-only filter.
#
# Run: ./scripts/docker-smoke.sh

watch:
  poll: 1s
  sources:
    - path: /var/log/app
      patterns:
        - "filter-smoke.log"
  state:
    path: /state/watermarks.json

sink:
  type: file
  file:
    path: /output/records.jsonl

parser:
  type: line

transform:
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - message
  on_error: wrap

filter:
  match: all
  rules:
    - type: field
      field: level
      op: in
      values: [ERROR]
      ignore_case: true

enrichers:
  - type: static
    fields:
      application_id: filter-smoke-test
      environment: docker
  - type: host

pipeline:
  buffer_size: 64
  on_full: block

metrics:
  enabled: true
  host: 0.0.0.0
  port: 8080
  path: /metrics
  readiness:
    buffer_threshold: 0.8

logging:
  level: info
  format: json
  status_interval: 0s
