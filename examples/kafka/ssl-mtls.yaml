# Mutual TLS (mTLS): broker verifies client certificate; client verifies broker.
watch:
  poll: 1s
  paths:
    - ./logs/app
  patterns:
    - "*.log"

kafka:
  brokers:
    - kafka.example.com:9093
  topic: logs
  security:
    protocol: SSL
    tls:
      ca_file: /etc/kafka/ca.crt
      cert_file: /etc/kafka/log-forwarder.crt
      key_file: /etc/kafka/log-forwarder.key

transform:
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - message
  on_error: wrap

enrichers:
  - type: host

pipeline:
  buffer_size: 1024
  on_full: block
