# SASL/OAUTHBEARER over TLS (Confluent Cloud, Azure Event Hubs, OIDC-integrated clusters).
watch:
  poll: 1s
  paths:
    - ./logs/app
  patterns:
    - "*.log"

kafka:
  brokers:
    - kafka.example.com:9093
  topic: logs
  security:
    protocol: SASL_SSL
    tls:
      ca_file: /etc/kafka/ca.crt
    sasl:
      mechanism: OAUTHBEARER
      oauth:
        token: ${KAFKA_OAUTH_TOKEN}

transform:
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - message
  on_error: wrap

enrichers:
  - type: host

pipeline:
  buffer_size: 1024
  on_full: block
