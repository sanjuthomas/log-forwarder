# SASL/PLAIN without TLS (development only — credentials are not encrypted on the wire).
watch:
  poll: 1s
  paths:
    - ./logs/app
  patterns:
    - "*.log"

kafka:
  brokers:
    - localhost:9092
  topic: logs
  security:
    protocol: SASL_PLAINTEXT
    sasl:
      mechanism: PLAIN
      username: log-forwarder
      password: ${KAFKA_PASSWORD}

transform:
  type: delimiter
  delimiter: "\t"
  columns:
    - timestamp
    - level
    - message
  on_error: wrap

enrichers:
  - type: host

pipeline:
  buffer_size: 1024
  on_full: block
